version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AI_SERVER_URL=http://ai-server:5000
      - DATABASE_PATH=./plantforge.db
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app/data
    depends_on:
      - ai-server

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_ENV=development
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o-mini}
      - OPENAI_GUIDE_MODEL=${OPENAI_GUIDE_MODEL:-gpt-4o-mini}

volumes:
  backend-uploads:
  backend-db:
